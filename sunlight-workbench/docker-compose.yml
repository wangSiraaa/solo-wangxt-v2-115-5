services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sunlight
      POSTGRES_PASSWORD: sunlight
      POSTGRES_DB: sunlight
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunlight"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://sunlight:sunlight@db:5432/sunlight
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  pgdata:
